const A=[
[1,"God Feels Far Away","Has God really been here the whole time, or have I just told myself that to feel better?","He’s Always Been There","God's presence is not measured by whether you can feel Him in a particular moment. Scripture's story is that He has been nearer than you knew—even in seasons when pain made Him difficult to recognize."],
[2,"God Feels Far Away","If God is real, why doesn’t He just show Himself?","He Showed You His Face","God has not left us with only hints about what He is like. Christianity says the invisible God made Himself known most clearly in Jesus Christ."],
[3,"God Feels Far Away","Why can’t I see what God is doing right now?","You’ll See It Looking Back","Some of God's work is almost impossible to recognize through the windshield. Faith often sees His hand more clearly in the rearview mirror, even when not every question is answered in this life."],
[4,"Why Did This Happen?","If God is good, why did He make a world with so much suffering in it?","This Is Not the World He Made","God did not design cruelty, disease, and death into a world He called very good. Scripture describes creation as fractured by sin—and promises that God is not finished restoring it."],
[5,"Why Did This Happen?","Is it wrong that I keep asking God why?","Honest Questions Are Not Unbelief","Honest questions are not the enemy of genuine faith. The Bible is filled with faithful people who brought God their confusion instead of pretending they had none."],
[6,"Why Did This Happen?","Why won’t God just tell me why this is happening?","He Knows More Than You Do","An explanation large enough to satisfy us may require knowledge we simply do not possess. Trust does not mean everything makes sense; it means the One who knows more than we do is still good."],
[7,"Why Did This Happen?","Can anything good actually come out of this?","All Things — Even This","Pain is never good merely because it hurts, but God is able to work through what He did not delight in. He can bring grace, compassion, endurance, ministry, and redemption out of wounds we would never have chosen."],
[8,"Why Did This Happen?","What do I do when the explanation never comes?","Sometimes He Gives You Himself Instead of an Explanation","Sometimes God does not give the explanation we keep asking for. Instead, He gives us Himself—and His presence can become an answer deeper than information."],
[9,"God Feels Far Away","Does God actually know what this feels like?","He Wept With You","Yes. Jesus did not observe human sorrow from a safe distance. He entered our world, wept at a grave, suffered betrayal, and knows grief from the inside."],
[10,"God Feels Far Away","Isn’t His sympathy enough?","He Didn’t Just Enter It — He Ended It","God's answer to suffering is more than sympathy. In Christ, He entered death itself and rose again, promising that suffering and death will not have the final word."],
[11,"Anger & Unanswered Prayer","Does God even care that they’re getting away with it?","His Silence Isn’t His Approval","God's patience should never be confused with indifference. Scripture repeatedly insists that injustice matters to Him, even when judgment does not arrive on our timetable."],
[12,"People Who Hurt Me","Am I just as guilty as the person who hurt me?","Your Pain and Their Guilt Are Not the Same Conversation","Your need for grace does not erase another person's responsibility for what they did. Universal sinfulness and specific guilt are both biblical truths—and they are not the same conversation."],
[13,"Anger & Unanswered Prayer","What do I do when God says no?","A No Is Not the End of the Story","A no from God can break your heart without ending your story. Faith learns to grieve the answer it wanted while trusting that God can still be present and purposeful in what follows."],
[14,"Grief & Loss","Is this really the end?","Death Does Not Get the Final Word","For the Christian, death is real, painful, and an enemy—but it is not ultimate. The resurrection of Jesus means the grave does not get the final word."],
[15,"Grief & Loss","How long am I allowed to still be sad about this?","You’re Allowed to Grieve as Long as It Takes","Grief is not a stopwatch. Love leaves a wound when someone is gone, and Scripture gives people room to mourn without shaming them for still hurting."],
[16,"Grief & Loss","Why did this happen to me?","Ask a Different Question","There may never be a satisfying answer to 'Why me?' A more life-giving question can become, 'God, what will You do in me and through me here?'"],
[17,"Grief & Loss","Why does it feel like I’m getting worse instead of better?","Grief That Stops Moving Becomes Bitterness","Grief can move slowly, but it must be allowed to move. When pain becomes a permanent identity or a place we refuse to leave, sorrow can harden into bitterness."],
[18,"Anger & Unanswered Prayer","Am I allowed to be furious with God?","Anger at God Is Not the Opposite of Faith","Anger at God is not automatically unbelief. The Psalms show that faith can be furious, confused, and wounded—and still turn toward God rather than away from Him."],
[19,"Anger & Unanswered Prayer","What do I even say to God right now?","Bring Him the Real Prayer, Not the Polished One","You do not have to edit your prayer before God will hear it. Bring Him the real prayer—the fear, anger, confusion, silence, and tears—not merely the polished version."],
[20,"People Who Hurt Me","Why does loving people hurt so much?","To Be Loved Is to Be Woundable","Love makes us vulnerable by definition. The possibility of being deeply known and deeply loved also creates the possibility of being deeply wounded."],
[21,"People Who Hurt Me","How am I supposed to forgive someone who never even said sorry?","Forgiving Them Lets You Look Like Your Father","Forgiveness is not saying what happened was acceptable. It is releasing personal vengeance to God and refusing to let another person's sin keep shaping your heart into their image."],
[22,"People Who Hurt Me","Does forgiving them mean I have to let them back in?","Forgiveness Is Not Reconciliation","Forgiveness and reconciliation are not identical. You can release vengeance while still recognizing that trust, access, and restored relationship may require repentance, truth, and safety."],
[23,"Doubt & Faith","Am I walking away from God, or from something else wearing His name?","Make Sure You’re Rejecting the Real Thing","Before you reject Christianity, make sure the thing you are rejecting is actually Christianity. Sometimes people are walking away from hypocrisy, abuse, legalism, or distortion rather than from Jesus Himself."],
[24,"Doubt & Faith","Does my doubt mean I was never really a believer?","Your Doubt Is Not Disqualifying","Doubt does not automatically disqualify faith. Biblical faith can tremble, ask questions, and struggle while still reaching toward Christ."]
].map(x=>({n:x[0],category:x[1],question:x[2],title:x[3],short:x[4]}));

function home(){navActive("home");app.innerHTML=`<section class="hero"><div class="wrap heroGrid"><div class="heroCopy"><h1>When your heart<br>is broken, you need<br>more than a cliché.</h1><p class="heroLead">No pretending. No shallow answers.<br>Just Scripture, honesty, and<br>a path toward hope.</p><div class="heroButtons"><a class="btn primary" href="?view=hurts">What Hurts Today?</a></div><div class="promise"><span class="promiseIcon">⌁</span><span>Biblical answers. Real hope. Lasting healing.</span></div></div><div class="bookStage"><div class="heroBook"><div class="coverTitle">Answers<br><span class="small">for a</span><br>Broken<br>Heart</div><div class="coverHeart">♡</div><div class="coverSub">24 Biblical Answers<br>for Life’s Deepest Hurts</div><div class="coverAuthor">TATE THRONDSON</div></div><div class="badge">A book<br>written for<br>the person<br>who is hurting<br>at 2:00 a.m.</div></div></div></section><section class="section hurts"><div class="wrap"><div class="center"><h2>What Hurts Today?</h2><div class="divider"></div><p class="centerIntro">Pain has a way of isolating us. You don’t have to walk through it alone.<br>Find biblical answers for whatever you’re facing.</p></div><div class="hurtGrid"><div class="hurtItem"><div class="iconWrap">${icons.heart}</div><h3>Grief &amp; Loss</h3><p>When the pain of losing someone feels unbearable.</p><a href="?view=hurts&cat=${encodeURIComponent("Grief & Loss")}">Find Answers →</a></div><div class="hurtItem"><div class="iconWrap">${icons.question}</div><h3>Questions &amp; Doubt</h3><p>When you don’t understand what God is doing.</p><a href="?view=hurts&cat=${encodeURIComponent("Doubt & Faith")}">Find Answers →</a></div><div class="hurtItem"><div class="iconWrap">${icons.cloud}</div><h3>Suffering &amp; Trials</h3><p>When life is hard and you don’t know how much more.</p><a href="?view=hurts&cat=${encodeURIComponent("Why Did This Happen?")}">Find Answers →</a></div><div class="hurtItem"><div class="iconWrap">${icons.person}</div><h3>Loneliness</h3><p>When you feel forgotten, unseen, or unwanted.</p><a href="?view=hurts&cat=${encodeURIComponent("God Feels Far Away")}">Find Answers →</a></div><div class="hurtItem"><div class="iconWrap">${icons.leaf}</div><h3>Hope &amp; Healing</h3><p>When you’re ready to take the next step forward.</p><a href="?view=hurts">Find Answers →</a></div></div><div class="center allTopics"><a class="btn outline" href="?view=hurts">View All 24 Topics</a></div></div></section><section class="bookBand"><div class="bookPhoto" aria-hidden="true"></div><div class="bookBandCopy"><p class="eyebrow">About the book</p><h2>Biblical answers for<br>life’s deepest hurts.</h2><p>This unique resource addresses 24 of life’s most common and most painful questions with honesty, compassion, and truth from God’s Word.</p><a class="btn primary" href="?view=book">Learn More About the Book</a></div><div class="features"><div class="feature"><div class="featureIcon">▤</div><div><strong>24 relevant topics</strong><span>Practical, biblical answers for real life.</span></div></div><div class="feature"><div class="featureIcon">†</div><div><strong>Rooted in Scripture</strong><span>Every answer is grounded in God’s unchanging truth.</span></div></div><div class="feature"><div class="featureIcon">♡</div><div><strong>Written for the hurting</strong><span>Straight talk and real hope for difficult seasons.</span></div></div></div></section><section class="section"><div class="wrap authorSample"><div class="authorPane"><h3 class="paneTitle">About Tate Throndson</h3><div class="smallRule"></div><div class="authorInner"><img class="authorPhoto" src="${AUTHOR}" alt="Tate Throndson"><div class="authorText"><p>Tate Throndson is the senior pastor of Castleview Baptist Church in Castle Rock, Colorado, where he has served since 2008.</p><p>He is a preacher, teacher, and author who is passionate about helping people know and follow Jesus in the middle of real life.</p><p>Tate and his wife, Debbie, have served together in ministry for more than twenty-five years.</p><a class="textLink" href="?view=about">Learn More About Tate →</a></div></div></div><div class="samplePane"><h3 class="paneTitle">See Inside</h3><div class="smallRule"></div><div class="sampleInner"><div><p class="sampleIntro">Explore a sample answer from the book.</p><div class="quoteBox">“The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.”<small>— Psalm 34:18</small></div><p class="sampleIntro">Read a sample answer and see how each topic is handled with truth and compassion.</p><a class="textLink" href="?answer=04">Read the Sample →</a></div><div class="openBook" aria-label="Open book preview"><div class="page"><div class="pageTitle">When<br>Does God<br>Make Sense<br>of Suffering?</div></div><div class="page">Pain has a way of asking questions we never planned to ask. The purpose of this book is not to minimize those questions, but to bring them honestly into the light of Scripture. God is not intimidated by a broken heart.</div></div></div></div></div></section><section class="newsletter" id="newsletter"><div class="wrap newsGrid"><div class="newsTitle"><div class="newsLeaf">♧</div><div><h2>Hope for today.<br>Strength for tomorrow.</h2><p>Get encouragement and updates to help you on your journey.</p></div></div><div class="signup"><input type="email" placeholder="Your email address" aria-label="Your email address"><button type="button">SIGN ME UP</button><div class="privacy">We respect your privacy. Unsubscribe at any time.</div></div></div></section>`}
function hurts(){navActive("hurts");let p=new URLSearchParams(location.search),chosen=p.get("cat")||"All";app.innerHTML=`<section class="subHero"><div class="wrap"><p class="eyebrow">Start with the question you are actually asking</p><h1>What hurts today?</h1><p class="lead">You don’t need the right words. You don’t need to pretend you’re doing better than you are. Choose the question that sounds closest to what you’re carrying, and begin there.</p></div></section><section class="section library"><div class="wrap"><input id="search" class="searchBox" type="search" placeholder="Type what you’re carrying — grief, anger, doubt, unanswered prayer…"><div class="filters">${["All",...cats.map(c=>c[0])].map(c=>`<button class="filter ${c===chosen?"active":""}" data-cat="${esc(c)}">${esc(c)}</button>`).join("")}</div><div id="questions" class="questionGrid"></div></div></section>`;const grid=document.getElementById("questions"),input=document.getElementById("search");function draw(){let term=input.value.trim().toLowerCase();let arr=A.filter(a=>(chosen==="All"||a.category===chosen)&&(!term||(a.question+" "+a.title+" "+a.category).toLowerCase().includes(term)));grid.innerHTML=arr.map(a=>`<a class="qcard" href="?answer=${String(a.n).padStart(2,"0")}"><div class="qnum">Answer ${String(a.n).padStart(2,"0")} · ${esc(a.category)}</div><h3>${esc(a.question)}</h3><p>${esc(a.title)}</p><b>Read the answer →</b></a>`).join("")||"<p>No matching questions yet. Try a different word.</p>"}document.querySelectorAll(".filter").forEach(b=>b.onclick=()=>{chosen=b.dataset.cat;document.querySelectorAll(".filter").forEach(x=>x.classList.toggle("active",x===b));draw()});input.oninput=draw;draw()}
function answer(n){navActive("");const a=A.find(x=>x.n===n)||A[0],next=A[a.n%24];app.innerHTML=`<section class="subHero"><div class="wrap"><div class="breadcrumb"><a href="./">Home</a> › <a href="?view=hurts">What Hurts Today?</a> › Answer ${String(a.n).padStart(2,"0")}</div><p class="eyebrow">Answer ${String(a.n).padStart(2,"0")} · ${esc(a.category)}</p><h1>${esc(a.question)}</h1><p class="lead">Biblical truth for the question beneath the pain.</p></div></section><div class="wrap articleWrap"><article class="article"><section class="shortAnswer"><p class="eyebrow" style="color:#d8c6a5">The short answer</p><h2>${esc(a.title)}</h2><p>${esc(a.short)}</p></section><h2>A place to begin</h2><p>${esc(a.short)}</p><p>That does not make the pain small, and it does not mean every question gets a tidy explanation. The purpose of this answer is not to talk you out of what you feel. It is to help you bring the real question into the light of Scripture and keep walking toward the God who has not abandoned the story.</p><p class="keyline">${esc(a.title)}</p><div class="scripture"><strong>Psalm 34:18 · KJV</strong><br><br>“The LORD is nigh unto them that are of a broken heart; and saveth such as be of a contrite spirit.”</div><div class="pastoral"><h3>If you are hurting right now</h3><p>You do not have to solve every question tonight. Bring God the part you can name, tell Him the truth about the part you cannot, and take the next faithful step in front of you. Pain does not require pretending.</p></div><a class="nextLink" href="?answer=${String(next.n).padStart(2,"0")}">Next: ${esc(next.question)} →</a></article><aside class="side"><h3>Keep exploring</h3><a href="?view=hurts">Browse all 24 answers</a><a href="?view=book">Explore the book</a><a href="./">Return home</a></aside></div>`}

function about(){navActive("about");app.innerHTML=`<section class="subHero"><div class="wrap"><p class="eyebrow">About the author</p><h1>Tate Throndson</h1><p class="lead">Pastor, preacher, and author helping people find biblical hope in the middle of real life.</p></div></section><section class="section"><div class="wrap authorPage"><img src="${AUTHOR}" alt="Tate Throndson"><div><p class="eyebrow">Pastoral answers for people in real pain</p><h2>More than an argument. A shepherd’s voice.</h2><p>Tate Throndson has served as lead pastor of Castleview Baptist Church in Castle Rock, Colorado, since planting it in 2008. He and his wife, Debbie, have served together in full-time ministry for more than twenty-five years.</p><p><em>Answers for a Broken Heart</em> grows out of years of sitting with people in hospital rooms, funeral homes, counseling conversations, and seasons when easy answers simply were not enough.</p><p class="keyline">The goal is not to explain away your pain. It is to help you recognize the God who has been present in it all along.</p><a class="btn primary" href="?view=hurts">Find an Answer</a></div></div></section>`}
