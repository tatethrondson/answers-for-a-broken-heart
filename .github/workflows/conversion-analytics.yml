name: Publish Conversion Analytics

on:
  push:
    branches: [main]
    paths:
      - 'scripts/analytics_events.py'
      - '.github/workflows/conversion-analytics.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Instrument site conversion events
        run: python scripts/analytics_events.py
      - name: Commit instrumented pages
        run: |
          if git diff --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Publish conversion analytics instrumentation"
          git push
