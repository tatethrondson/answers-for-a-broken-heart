name: Link Book and Free Resources homepage match v3

on:
  push:
    paths:
      - '.github/workflows/link-book-free-homepage-match-v3.yml'

permissions:
  contents: write

jobs:
  link-homepage-match:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Link homepage-match stylesheet last
        shell: python
        run: |
          from pathlib import Path
          for filename in ['book.html','free-guides.html']:
              p=Path(filename)
              text=p.read_text()
              old='/site-book-free-neutral-v2.css?v=2'
              new='/site-book-free-homepage-match-v3.css?v=3'
              if old not in text:
                  raise SystemExit(f'{old} not found in {filename}')
              p.write_text(text.replace(old,new,1))
      - name: Commit homepage-match links
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html free-guides.html
          git commit -m "Use homepage hero treatment on Book and Free Resources"
          git push origin main
