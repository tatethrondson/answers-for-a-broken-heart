name: Check Production Host

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/host-check.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check non-www and www redirects
        run: |
          echo '--- non-www ---'
          curl -sSIL --max-redirs 8 -o /tmp/nonwww -w 'final=%{url_effective}\nstatus=%{http_code}\n' https://answersforabrokenheart.com/
          cat /tmp/nonwww
          echo '--- www ---'
          curl -sSIL --max-redirs 8 -o /tmp/www -w 'final=%{url_effective}\nstatus=%{http_code}\n' https://www.answersforabrokenheart.com/
          cat /tmp/www
