name: Publish Homepage Lead Capture

on:
  push:
    branches: [main]
    paths:
      - 'scripts/home_lead_capture.py'
      - '.github/workflows/home-lead-capture.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Update homepage lead magnet
        run: python scripts/home_lead_capture.py
      - name: Commit homepage update
        run: |
          if git diff --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish 2AM guide homepage capture"
          git push
