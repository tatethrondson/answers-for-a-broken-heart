name: Publish Topic Hubs

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/topic_hubs.py'
      - 'scripts/content_strengthening.py'
      - 'scripts/content_strengthening_wave2.py'
      - 'scripts/content_strengthening_wave3.py'
      - 'scripts/answer_content_strengthening.py'
      - 'scripts/answer_content_strengthening_wave2.py'
      - 'scripts/seo.py'
      - 'sitemap.xml'
      - 'index.html'
      - 'what-hurts-today.html'
      - 'answer-*.html'
      - 'can-christians-be-depressed.html'
      - '.github/workflows/topic-hubs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topic-hub-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and connect topic hubs
        run: python scripts/topic_hubs.py

      - name: Strengthen first-wave priority hub content
        run: python scripts/content_strengthening.py

      - name: Strengthen second-wave pastoral content
        run: python scripts/content_strengthening_wave2.py

      - name: Strengthen third-wave pastoral content
        run: python scripts/content_strengthening_wave3.py

      - name: Strengthen exact-question answer pages
        run: python scripts/answer_content_strengthening.py

      - name: Strengthen second exact-question answer wave
        run: python scripts/answer_content_strengthening_wave2.py

      - name: Commit topic hub layer
        run: |
          if [ -n "$(git status --porcelain -- index.html what-hurts-today.html answer-*.html sitemap.xml can-christians-be-depressed.html grief-and-loss.html why-god-allows-suffering.html god-feels-far-away.html anger-and-unanswered-prayer.html forgiveness-and-relational-hurt.html doubt-and-church-hurt.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "4189826+github-actions[bot]@users.noreply.github.com"
            git add index.html what-hurts-today.html answer-*.html sitemap.xml can-christians-be-depressed.html grief-and-loss.html why-god-allows-suffering.html god-feels-far-away.html anger-and-unanswered-prayer.html forgiveness-and-relational-hurt.html doubt-and-church-hurt.html
            git commit -m "Strengthen second exact-question answer wave"
            git push
          else
            echo "Topic hub and content strengthening layers are already current"
          fi
