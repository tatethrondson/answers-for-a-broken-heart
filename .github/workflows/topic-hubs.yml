name: Publish Topic Hubs

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/topic_hubs.py'
      - 'scripts/seo.py'
      - 'sitemap.xml'
      - 'index.html'
      - 'what-hurts-today.html'
      - 'answer-*.html'
      - '.github/workflows/topic-hubs.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: topic-hub-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate and connect topic hubs
        run: python scripts/topic_hubs.py

      - name: Commit topic hub layer
        run: |
          if [ -n "$(git status --porcelain -- index.html what-hurts-today.html answer-*.html sitemap.xml grief-and-loss.html why-god-allows-suffering.html god-feels-far-away.html anger-and-unanswered-prayer.html forgiveness-and-relational-hurt.html doubt-and-church-hurt.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html what-hurts-today.html answer-*.html sitemap.xml grief-and-loss.html why-god-allows-suffering.html god-feels-far-away.html anger-and-unanswered-prayer.html forgiveness-and-relational-hurt.html doubt-and-church-hurt.html
            git commit -m "Publish six pastoral topic hubs"
            git push
          else
            echo "Topic hub layer is already current"
          fi
