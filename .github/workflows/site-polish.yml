name: Publish Site Audit Cleanup

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/site_polish.py'
      - 'scripts/guide_cta_fix.py'
      - 'scripts/analytics_events.py'
      - '.github/workflows/site-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-audit-polish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply final audit cleanup
        run: python scripts/site_polish.py

      - name: Keep non-gated guides clearly open
        run: python scripts/guide_cta_fix.py

      - name: Instrument the help-first funnel
        run: python scripts/analytics_events.py

      - name: Commit polished pages
        run: |
          if [ -z "$(git status --porcelain -- '*.html')" ]; then
            echo "Site audit cleanup is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Publish final site audit cleanup"
          git pull --rebase origin main
          git push
