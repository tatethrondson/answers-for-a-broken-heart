name: Publish Site Audit Cleanup

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/site_polish.py'
      - 'scripts/guide_cta_fix.py'
      - 'scripts/analytics_events.py'
      - 'scripts/email_segments.py'
      - 'scripts/site_qa.py'
      - '.github/workflows/site-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: site-audit-polish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Apply final audit cleanup
        run: python scripts/site_polish.py

      - name: Keep non-gated guides clearly open
        run: python scripts/guide_cta_fix.py

      - name: Tag email signup audiences
        run: python scripts/email_segments.py

      - name: Instrument the help-first funnel
        run: python scripts/analytics_events.py

      - name: QA the generated pages
        run: python scripts/site_qa.py

      - name: Commit polished pages
        run: |
          if [ -z "$(git status --porcelain -- '*.html' 'SITE-QA.md')" ]; then
            echo "Site audit cleanup is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' SITE-QA.md
          git commit -m "Publish final site audit cleanup"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then
              exit 0
            fi
            echo "Push raced another workflow; retrying ($attempt/3)"
            sleep 2
          done
          echo "Unable to publish after 3 attempts"
          exit 1
