name: Diagnose women journal assets

on:
  push:
    branches: [women-journal-exact-upload]
    paths:
      - '.github/workflows/diagnose-women-journal-assets.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: women-journal-exact-upload
      - name: Package all historical journal assets
        run: tar -czf journal-assets-history.tgz journal-assets
      - uses: actions/upload-artifact@v4
        with:
          name: journal-assets-history
          path: journal-assets-history.tgz
