name: Diagnose women journal assets

on:
  push:
    branches: [women-journal-exact-upload]
    paths:
      - '.github/workflows/diagnose-women-journal-assets.yml'

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: women-journal-exact-upload
      - name: Download historical Filebin candidate
        run: |
          curl -fL --retry 3 'https://filebin.net/afabh-women-20260814/Faith_and_Feelings_30_Day_Journal_for_Women.pdf' -o filebin-women.pdf || true
          if [ -f filebin-women.pdf ]; then
            sha256sum filebin-women.pdf
            file filebin-women.pdf
            pdfinfo filebin-women.pdf || true
          fi
      - uses: actions/upload-artifact@v4
        if: ${{ hashFiles('filebin-women.pdf') != '' }}
        with:
          name: filebin-women
          path: filebin-women.pdf
