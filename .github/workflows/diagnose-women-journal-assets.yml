name: Diagnose women journal assets

on:
  push:
    branches: [women-journal-exact-upload]
    paths:
      - '.github/workflows/diagnose-women-journal-assets.yml'

permissions:
  contents: write

jobs:
  diagnose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: women-journal-exact-upload
      - name: Reconstruct historical women PDF
        shell: python
        run: |
          from pathlib import Path
          import re,base64,hashlib
          vals=[]
          for p in sorted(Path('journal-assets/women').glob('*.js')):
              s=p.read_text(errors='ignore')
              for idx,val in re.findall(r'\[(\d+)\]\s*=\s*"([A-Za-z0-9+/=]+)"',s):
                  vals.append((int(idx),val,p.name))
          vals.sort(key=lambda x:(x[0],x[2]))
          d={}
          for idx,val,name in vals: d[idx]=val
          keys=sorted(d)
          print('indexes', keys)
          print('lens', [len(d[i]) for i in keys])
          text=''.join(d[i] for i in keys)
          raw=base64.b64decode(text+'='*((-len(text))%4),validate=False)
          Path('historical-women.pdf').write_bytes(raw)
          print('bytes',len(raw),'sha256',hashlib.sha256(raw).hexdigest(),'sig',raw[:8],'eof',raw.rfind(b'%%EOF'))
      - name: Inspect PDF
        run: |
          file historical-women.pdf
          pdfinfo historical-women.pdf || true
      - uses: actions/upload-artifact@v4
        with:
          name: historical-women-pdf
          path: historical-women.pdf
