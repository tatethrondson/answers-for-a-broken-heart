name: Remove Book and Free Resources green from v5

on:
  push:
    paths:
      - '.github/workflows/remove-book-free-green-from-v5.yml'

permissions:
  contents: write

jobs:
  neutralize-v5:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Neutralize legacy v5 rules
        shell: python
        run: |
          from pathlib import Path

          css = Path('site-body-lock-v5.css')
          text = css.read_text()

          old = '''body.page-book .darkBand,
body.page-free-guides .darkBand{
  background:var(--ab-deep,#183024)!important;color:#fff!important;
  border:0!important;border-radius:0!important;box-shadow:none!important;
}
body.page-book .darkBand h2,
body.page-free-guides .darkBand h2{color:#fff!important}
body.page-book .darkBand p,
body.page-free-guides .darkBand p{color:rgba(255,255,255,.80)!important}
body.page-book .darkBand .eyebrow,
body.page-free-guides .darkBand .eyebrow{color:#d8bd87!important}'''
          new = '''body.page-book .darkBand,
body.page-free-guides .darkBand{
  background:var(--ab-warm,#fbf8f2)!important;color:var(--ab-ink,#242a26)!important;
  border-top:1px solid var(--ab-line,#ded8cd)!important;
  border-bottom:1px solid var(--ab-line,#ded8cd)!important;
  border-radius:0!important;box-shadow:none!important;
}
body.page-book .darkBand h2,
body.page-free-guides .darkBand h2{color:var(--ab-deep,#183024)!important}
body.page-book .darkBand p,
body.page-free-guides .darkBand p{color:var(--ab-muted,#656d67)!important}
body.page-book .darkBand .eyebrow,
body.page-free-guides .darkBand .eyebrow{color:var(--ab-gold,#ad823d)!important}'''
          if old not in text:
              raise SystemExit('darkBand legacy block not found')
          text = text.replace(old, new, 1)

          old = '''body.page-book .scriptureBox{
  background:var(--ab-deep,#183024)!important;color:#fff!important;
  border:0!important;border-radius:0!important;box-shadow:none!important;
}
body.page-book .scriptureBox p{color:rgba(255,255,255,.90)!important}
body.page-book .scriptureBox small{color:#d8bd87!important}'''
          new = '''body.page-book .scriptureBox{
  background:var(--ab-cream,#f5f0e7)!important;color:var(--ab-ink,#242a26)!important;
  border:1px solid var(--ab-line,#ded8cd)!important;
  border-top:4px solid var(--ab-gold,#ad823d)!important;
  border-radius:0!important;box-shadow:none!important;
}
body.page-book .scriptureBox p{color:var(--ab-muted,#656d67)!important}
body.page-book .scriptureBox small{color:var(--ab-gold,#ad823d)!important}'''
          if old not in text:
              raise SystemExit('scriptureBox legacy block not found')
          text = text.replace(old, new, 1)

          old = '''body.page-free-guides .tonightCard{
  background:var(--ab-deep,#183024)!important;color:#fff!important;
  border:0!important;border-radius:0!important;box-shadow:none!important;
}
body.page-free-guides .tonightCard small{color:#d8bd87!important}
body.page-free-guides .tonightCard h2{color:#fff!important}
body.page-free-guides .tonightCard p{color:rgba(255,255,255,.80)!important}'''
          new = '''body.page-free-guides .tonightCard{
  background:var(--ab-cream,#f5f0e7)!important;color:var(--ab-ink,#242a26)!important;
  border:1px solid var(--ab-line,#ded8cd)!important;
  border-top:4px solid var(--ab-gold,#ad823d)!important;
  border-radius:0!important;box-shadow:none!important;
}
body.page-free-guides .tonightCard small{color:var(--ab-gold,#ad823d)!important}
body.page-free-guides .tonightCard h2{color:var(--ab-deep,#183024)!important}
body.page-free-guides .tonightCard p{color:var(--ab-muted,#656d67)!important}'''
          if old not in text:
              raise SystemExit('tonightCard legacy block not found')
          text = text.replace(old, new, 1)

          css.write_text(text)

          for filename in ['book.html', 'free-guides.html']:
              path = Path(filename)
              html = path.read_text().replace('/site-body-lock-v5.css?v=5', '/site-body-lock-v5.css?v=6')
              path.write_text(html)

      - name: Commit neutralized legacy styles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site-body-lock-v5.css book.html free-guides.html
          git commit -m "Remove legacy green surfaces from Book and Free Resources"
          git push origin main
