name: Use homepage color roles v5

on:
  push:
    paths:
      - '.github/workflows/use-homepage-role-v5.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Point Book and Free Resources to v5
        run: |
          python - <<'PY'
          from pathlib import Path
          old_names = [
              '/site-book-free-color-balance-v4.css?v=4',
              '/site-book-free-homepage-match-v3.css?v=3',
              '/site-book-free-neutral-v2.css?v=2',
          ]
          new = '/site-book-free-homepage-role-v5.css?v=5'
          for name in ['book.html','free-guides.html']:
              p = Path(name)
              s = p.read_text()
              for old in old_names:
                  s = s.replace(old, new)
              # De-duplicate if prior experiments left more than one v5 link.
              target = f'<link rel="stylesheet" href="{new}">'
              lines = s.splitlines()
              seen = False
              out = []
              for line in lines:
                  if new in line:
                      if seen:
                          continue
                      line = target
                      seen = True
                  out.append(line)
              p.write_text('\n'.join(out) + ('\n' if s.endswith('\n') else ''))
          PY
      - name: Commit change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html free-guides.html
          git diff --cached --quiet || git commit -m "Use exact homepage color roles on Book and Free Resources"
          git push
