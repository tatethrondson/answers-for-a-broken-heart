name: Inject inline portrait loader

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      - name: Inject portrait loader
        run: |
          python - <<'PY'
          from pathlib import Path
          tag='<script src="/portrait-inline.js?v=1"></script>'
          changed=[]
          for p in Path('.').rglob('*.html'):
              if '.git' in p.parts:
                  continue
              s=p.read_text(encoding='utf-8')
              if tag in s:
                  continue
              if '</body>' in s:
                  s=s.replace('</body>', tag+'</body>')
                  p.write_text(s,encoding='utf-8')
                  changed.append(str(p))
          print('updated',len(changed),'html files')
          PY
      - name: Commit
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use embedded author portrait across site"
          git push
