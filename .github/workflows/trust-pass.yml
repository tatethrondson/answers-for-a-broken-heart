name: Publish Trust and Credibility Pass
on:
  push:
    branches: [main]
    paths:
      - 'scripts/trust_pass.py'
      - '.github/workflows/trust-pass.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/trust_pass.py
      - name: Commit trust pass
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html about.html answer-*.html
          git commit -m "Publish trust and credibility pass"
          git push
