name: Publish Answer Journey
# trigger: refresh answer-page sharing tools

on:
  push:
    branches: [main]
    paths:
      - 'scripts/answer_journey.py'
      - '.github/workflows/answer-journey.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply answer journey to all 24 pages
        run: python scripts/answer_journey.py
      - name: Commit generated answer pages
        run: |
          if git diff --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add answer-*.html
          git commit -m "Publish unified answer journeys"
          git push
