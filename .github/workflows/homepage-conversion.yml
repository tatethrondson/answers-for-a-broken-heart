name: Publish Homepage Conversion Pass
on:
  push:
    branches: [main]
    paths:
      - 'scripts/homepage_conversion.py'
      - '.github/workflows/homepage-conversion.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/homepage_conversion.py
      - name: Commit homepage conversion pass
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish focused homepage conversion pass"
          git push