name: Publish Church Resources Homepage Links

on:
  push:
    branches: [main]
    paths:
      - 'scripts/church_resources_homepage.py'
      - '.github/workflows/church-resources-homepage.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add Church Resources links
        run: python scripts/church_resources_homepage.py
      - name: Commit homepage
        run: |
          if git diff --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish Church Resources homepage links"
          git push