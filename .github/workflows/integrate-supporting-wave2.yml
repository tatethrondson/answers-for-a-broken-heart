name: Integrate Supporting Articles Wave 2

on:
  push:
    branches: [main]
    paths:
      - 'scripts/integrate_supporting_wave2.py'
      - '.github/workflows/integrate-supporting-wave2.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate supporting content
        run: python scripts/integrate_supporting_wave2.py
      - name: Run site QA
        run: python scripts/site_qa.py
      - name: Commit integration
        run: |
          if [ -n "$(git status --porcelain -- anger-and-unanswered-prayer.html grief-and-loss.html help-someone.html god-feels-far-away.html sitemap.xml SITE-QA.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add anger-and-unanswered-prayer.html grief-and-loss.html help-someone.html god-feels-far-away.html sitemap.xml SITE-QA.md
            git commit -m "Integrate second-wave practical help articles"
            git pull --rebase origin main
            git push
          else
            echo "Supporting content is already integrated"
          fi
