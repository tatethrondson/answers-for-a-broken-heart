name: Link final Book and Free Resources palette

on:
  push:
    paths:
      - '.github/workflows/link-final-neutral-css.yml'

permissions:
  contents: write

jobs:
  link-neutral-css:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Load final neutral stylesheet last
        shell: python
        run: |
          from pathlib import Path

          target_link = '<link rel="stylesheet" href="/site-book-free-neutral-v1.css?v=1">'
          anchor = '<link rel="stylesheet" href="/site-shell.css?v=3">'
          changed = []

          for filename in ['book.html', 'free-guides.html']:
              path = Path(filename)
              text = path.read_text()
              if target_link in text:
                  continue
              if anchor not in text:
                  raise SystemExit(f'Expected final shell stylesheet not found in {filename}')
              text = text.replace(anchor, anchor + '\n' + target_link, 1)
              path.write_text(text)
              changed.append(filename)

          print('Updated:', ', '.join(changed) if changed else 'none')

      - name: Commit final palette links
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html free-guides.html
          git commit -m "Load final neutral palette last on Book and Free Resources"
          git push origin main
