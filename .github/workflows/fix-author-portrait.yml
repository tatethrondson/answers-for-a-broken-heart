name: Fix author portrait

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-portrait:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Replace local portrait references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          hosted = 'https://avatars.githubusercontent.com/u/314793130?v=4'
          extensions = {'.html', '.css', '.js', '.mjs'}
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = re.sub(r'/?author-tate\.jpg(?:\?v=\d+)?', hosted, text)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit fixed portrait references
        run: |
          if git diff --quiet; then
            echo "No portrait references needed updating."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Use hosted Tate portrait to fix broken image"
          git push
