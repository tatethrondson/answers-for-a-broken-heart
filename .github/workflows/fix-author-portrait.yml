name: Restore correct author portrait

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix-portrait:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Restore correct portrait and references
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          source = Path('author-tate.jpg')
          target = Path('tate-throndson-portrait-2026.jpg')
          if not source.exists():
              raise SystemExit('author-tate.jpg is missing')
          if not target.exists() or target.read_bytes() != source.read_bytes():
              target.write_bytes(source.read_bytes())

          avatar = 'https://avatars.githubusercontent.com/u/314793130?v=4'
          fresh = '/tate-throndson-portrait-2026.jpg?v=1'
          extensions = {'.html', '.css', '.js', '.mjs'}
          changed = []

          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in extensions:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              new = text.replace(avatar, fresh)
              new = re.sub(r'/?author-tate\.jpg(?:\?v=\d+)?', fresh, new)
              if new != text:
                  path.write_text(new, encoding='utf-8')
                  changed.append(str(path))

          print('Updated:', ', '.join(changed) if changed else 'none')
          PY

      - name: Commit restored portrait
        run: |
          if git diff --quiet; then
            echo "No portrait changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Restore correct Tate portrait across site"
          git push
