name: Generate Answer Social Cards

on:
  push:
    branches: [main]
    paths:
      - 'scripts/generate_answer_social_cards.py'
      - '.github/workflows/generate-answer-social-cards.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Install Pillow
        run: python -m pip install --quiet pillow
      - name: Generate 24 social cards and update metadata
        run: python scripts/generate_answer_social_cards.py
      - name: Run site QA
        run: python scripts/site_qa.py
      - name: Commit cards and metadata
        run: |
          if [ -n "$(git status --porcelain -- 'answer-*.html' social SITE-QA.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'answer-*.html' social SITE-QA.md
            git commit -m "Publish branded social cards for all Answers"
            git pull --rebase origin main
            git push
          else
            echo "Social cards and metadata are already current"
          fi
