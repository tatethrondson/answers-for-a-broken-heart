name: Repair clean portrait

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Write verified baseline JPEG and update references
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          payload = ''''''
          data = base64.b64decode(payload)
          assert data[:2] == b'\xff\xd8' and data[-2:] == b'\xff\xd9'
          assert len(data) == 12401, len(data)
          Path('tate-throndson-portrait-clean.jpg').write_bytes(data)

          old = 'tate-throndson-portrait-2026.jpg?v=1'
          new = 'tate-throndson-portrait-clean.jpg?v=2'
          for path in Path('.').rglob('*'):
              if not path.is_file() or '.git' in path.parts or '.github' in path.parts:
                  continue
              if path.suffix.lower() not in {'.html', '.css', '.js', '.mjs', '.json'}:
                  continue
              try:
                  text = path.read_text(encoding='utf-8')
              except UnicodeDecodeError:
                  continue
              changed = text.replace(old, new)
              if changed != text:
                  path.write_text(changed, encoding='utf-8')
          PY

      - name: Commit clean portrait
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Replace partial portrait with clean baseline JPEG"
          git push
