name: Publish Question SEO Pass

on:
  push:
    branches: [main]
    paths:
      - 'scripts/seo_question_pass.py'
      - '.github/workflows/seo-question-pass.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply question-focused SEO pass
        run: python scripts/seo_question_pass.py
      - name: Commit generated answer pages
        run: |
          if git diff --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add answer-*.html
          git commit -m "Publish question-focused SEO pass"
          git push