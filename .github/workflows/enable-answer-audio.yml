name: Enable Answer Audio Runtime

on:
  push:
    branches: [main]
    paths:
      - 'scripts/enable_answer_audio.py'
      - '.github/workflows/enable-answer-audio.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: enable-answer-audio
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Enable audio runtime on all Answers
        run: python scripts/enable_answer_audio.py
      - name: Run site QA
        run: python scripts/site_qa.py
      - name: Commit audio readiness
        run: |
          if [ -n "$(git status --porcelain -- 'answer-*.html' SITE-QA.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add 'answer-*.html' SITE-QA.md
            git commit -m "Make all Answer pages audio-ready"
            git pull --rebase origin main
            git push
          else
            echo "Answer pages are already audio-ready"
          fi
