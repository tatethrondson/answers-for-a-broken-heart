name: Force Book and Free Resources neutral palette

on:
  push:
    paths:
      - '.github/workflows/force-book-free-neutral-palette.yml'

permissions:
  contents: write

jobs:
  fix-palette:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Replace legacy green surfaces at source
        shell: python
        run: |
          from pathlib import Path

          replacements = {
            'book.html': [
              ('.darkBand{background:var(--deep);color:#fff;padding:55px 0}', '.darkBand{background:#faf8f3;color:var(--ink);padding:55px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}'),
              ('.darkBand h2{color:#fff;font-size:2.4rem;line-height:1.05;margin:0 0 10px}', '.darkBand h2{color:var(--deep);font-size:2.4rem;line-height:1.05;margin:0 0 10px}'),
              ('.darkBand p{color:rgba(255,255,255,.78);margin:0}', '.darkBand p{color:var(--muted);margin:0}'),
              ('.darkBand .eyebrow{color:#d8bd87}', '.darkBand .eyebrow{color:var(--gold)}'),
              ('.scriptureBox{background:var(--deep);color:#fff;padding:35px 38px}', '.scriptureBox{background:var(--cream);color:var(--ink);padding:35px 38px;border:1px solid var(--line);border-top:4px solid var(--gold)}'),
              ('.scriptureBox p{font:1.1rem/1.62 Georgia,"Times New Roman",serif;color:rgba(255,255,255,.92);margin:0 0 12px}', '.scriptureBox p{font:1.1rem/1.62 Georgia,"Times New Roman",serif;color:var(--muted);margin:0 0 12px}'),
              ('.scriptureBox small{color:#d8bd87;text-transform:uppercase;letter-spacing:.1em;font-size:.66rem;font-weight:800}', '.scriptureBox small{color:var(--gold);text-transform:uppercase;letter-spacing:.1em;font-size:.66rem;font-weight:800}'),
            ],
            'free-guides.html': [
              ('.darkBand{background:var(--deep);color:#fff;padding:55px 0}', '.darkBand{background:#faf8f3;color:var(--ink);padding:55px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}'),
              ('.darkBand h2{color:#fff;font-size:2.4rem;line-height:1.05;margin:0 0 10px}', '.darkBand h2{color:var(--deep);font-size:2.4rem;line-height:1.05;margin:0 0 10px}'),
              ('.darkBand p{color:rgba(255,255,255,.78);margin:0}', '.darkBand p{color:var(--muted);margin:0}'),
              ('.darkBand .eyebrow{color:#d8bd87}', '.darkBand .eyebrow{color:var(--gold)}'),
              ('.tonightCard{background:var(--deep);color:#fff;padding:28px 29px;border:0}', '.tonightCard{background:var(--cream);color:var(--ink);padding:28px 29px;border:1px solid var(--line);border-top:4px solid var(--gold)}'),
              ('.tonightCard small{display:block;text-transform:uppercase;letter-spacing:.14em;color:#d8bd87;font-size:.63rem;font-weight:800;margin-bottom:8px}', '.tonightCard small{display:block;text-transform:uppercase;letter-spacing:.14em;color:var(--gold);font-size:.63rem;font-weight:800;margin-bottom:8px}'),
              ('.tonightCard h2{color:#fff;font-size:1.85rem;line-height:1.08;margin:0 0 9px}', '.tonightCard h2{color:var(--deep);font-size:1.85rem;line-height:1.08;margin:0 0 9px}'),
              ('.tonightCard p{color:rgba(255,255,255,.78);font-size:.85rem;margin:0 0 17px}', '.tonightCard p{color:var(--muted);font-size:.85rem;margin:0 0 17px}'),
              ('.tonightCard .btn{background:#fff;color:var(--deep);border-color:#fff}', '.tonightCard .btn{background:var(--pine);color:#fff;border-color:var(--pine)}'),
            ],
          }

          changed = []
          for filename, reps in replacements.items():
            path = Path(filename)
            text = path.read_text()
            original = text
            for old, new in reps:
              if old in text:
                text = text.replace(old, new)
            text = text.replace('/site-shell.css?v=2', '/site-shell.css?v=3')
            if text != original:
              path.write_text(text)
              changed.append(filename)
          print('Updated:', ', '.join(changed) if changed else 'none')
      - name: Commit page-source palette fix
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add book.html free-guides.html
          git commit -m "Remove dominant green surfaces from Book and Free Resources"
          git push origin main
