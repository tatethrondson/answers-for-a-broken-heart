name: Publish SEO Refresh

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/seo.py'
      - '.github/workflows/seo-refresh.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: seo-refresh-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Generate SEO refresh
        run: python scripts/seo.py

      - name: Commit generated SEO files
        run: |
          if [ -n "$(git status --porcelain -- index.html answer-*.html sitemap.xml robots.txt)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html answer-*.html sitemap.xml robots.txt
            git commit -m "Publish search-intent SEO and author trust signals"
            git push
          else
            echo "SEO refresh is already current"
          fi
