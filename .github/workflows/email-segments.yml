name: Publish Email Segmentation
on:
  push:
    branches: [main]
    paths:
      - 'scripts/email_segments.py'
      - 'config/email-signups.json'
      - '.github/workflows/email-segments.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: python scripts/email_segments.py
      - name: Commit segmented forms
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Publish email signup segmentation"
          git push
