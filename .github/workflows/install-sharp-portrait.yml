name: Install sharpened portrait

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  install:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build portrait and update references
        run: |
          cat portrait_parts/part01.txt portrait_parts/part02.txt portrait_parts/part03.txt portrait_parts/part04.txt | tr -d '\n' | base64 -d > tate-throndson-portrait-sharp-2026.jpg

          test "$(head -c 2 tate-throndson-portrait-sharp-2026.jpg | xxd -p)" = "ffd8"
          test "$(tail -c 2 tate-throndson-portrait-sharp-2026.jpg | xxd -p)" = "ffd9"

          python - <<'PY'
          from pathlib import Path
          import json

          old_variants = [
              '/tate-throndson-portrait-final.jpg?v=2',
              '/tate-throndson-portrait-final.jpg?v=1',
              '/tate-throndson-portrait-final.jpg',
              '/tate-throndson-portrait-2026.jpg?v=1',
              '/tate-throndson-portrait-2026.jpg',
              '/author-tate.jpg',
          ]
          new = '/tate-throndson-portrait-sharp-2026.jpg?v=1'

          targets = [Path('portrait-inline.js'), *Path('.').rglob('*.html')]
          for p in targets:
              if not p.exists() or '.git' in p.parts:
                  continue
              s = p.read_text(encoding='utf-8')
              original = s
              for old in old_variants:
                  s = s.replace(old, new)
              if s != original:
                  p.write_text(s, encoding='utf-8')

          p = Path('vercel.json')
          data = json.loads(p.read_text(encoding='utf-8'))
          headers = data.setdefault('headers', [])
          source = '/tate-throndson-portrait-sharp-2026.jpg'
          headers = [h for h in headers if h.get('source') != source]
          headers.insert(0, {
              'source': source,
              'headers': [
                  {'key': 'Content-Type', 'value': 'image/jpeg'},
                  {'key': 'Cache-Control', 'value': 'no-store, max-age=0'}
              ]
          })
          data['headers'] = headers
          p.write_text(json.dumps(data, indent=2) + '\n', encoding='utf-8')
          PY

      - name: Clean temporary installer files
        run: |
          rm -rf portrait_parts
          rm -f portrait-sharp-trigger.txt
          rm -f .github/workflows/install-sharp-portrait.yml

      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Install sharpened author portrait"
          git push
