name: Publish Hurting-Person Experience

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/hurting_experience.py'
      - '.github/workflows/hurting-experience.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: hurting-person-experience
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add 60-second help and emotional-language search
        run: python scripts/hurting_experience.py

      - name: Commit generated experience improvements
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add answer-*.html what-hurts-today.html
            git commit -m "Improve hurting-person site experience"
            git push
          else
            echo "Hurting-person experience is already current"
          fi
