name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Normalize Tate portrait to static asset
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text()
          html2, count = re.subn(
              r'const AUTHOR="(?:data:image/jpeg;base64,[^"]+|author-tate\.jpg|/author-tate\.jpg)";',
              'const AUTHOR="/author-tate.jpg";',
              html,
              count=1,
          )
          if count != 1:
              raise SystemExit(f'Expected one AUTHOR declaration, changed {count}')
          index.write_text(html2)
          PY

      - name: Commit portrait source fix
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Use static Tate author portrait asset"
            git push
          else
            echo "No source change needed"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
