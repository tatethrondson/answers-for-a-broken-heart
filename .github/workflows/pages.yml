name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Permanently embed Tate author portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          index = Path('index.html')
          portrait = Path('author-tate.jpg')
          html = index.read_text()
          marker = 'const AUTHOR="author-tate.jpg";'
          already = 'const AUTHOR="data:image/jpeg;base64,'

          if marker in html:
              encoded = base64.b64encode(portrait.read_bytes()).decode('ascii')
              html = html.replace(marker, f'const AUTHOR="data:image/jpeg;base64,{encoded}";')
              index.write_text(html)
              print('Embedded portrait directly into index.html')
          elif already in html:
              print('Portrait is already embedded in index.html')
          else:
              raise SystemExit('Could not find author portrait reference in index.html')
          PY

      - name: Commit embedded portrait to main
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Embed Tate author portrait in homepage"
            git push
          else
            echo "No source change needed"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
