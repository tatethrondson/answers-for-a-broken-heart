name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wire expanded answer pages into the site
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text()

          # Standalone expanded pages must use normal browser navigation.
          html = html.replace(
              'if(href&&!href.startsWith("#")){e.preventDefault();go(href)}',
              'if(href&&!href.startsWith("#")&&!href.startsWith("/answer-")){e.preventDefault();go(href)}',
              1,
          )

          # All published answer pages 04-24 now use standalone URLs.
          if 'function answerHref(n)' not in html:
              html = html.replace(
                  'function go(url){',
                  'function answerHref(n){const s=String(n).padStart(2,"0");return n>=4&&n<=24?`/answer-${s}`:`?answer=${s}`}function go(url){',
                  1,
              )
          html = re.sub(
              r'return n>=4&&n<=\d+\?',
              'return n>=4&&n<=24?',
              html,
              count=1,
          )

          # Point library cards and dynamic next links at expanded pages when available.
          html = html.replace(
              'href="?answer=${String(a.n).padStart(2,"0")}"',
              'href="${answerHref(a.n)}"',
          )
          html = html.replace(
              'href="?answer=${String(next.n).padStart(2,"0")}"',
              'href="${answerHref(next.n)}"',
          )
          html = html.replace('href="?answer=04"', 'href="/answer-04"')
          index.write_text(html)

          # Keep standalone reading transitions on standalone pages.
          transitions = {
              'answer-10.html': ('href="/?answer=11"', 'href="/answer-11"'),
              'answer-14.html': ('href="/?answer=15"', 'href="/answer-15"'),
              'answer-19.html': ('href="/?answer=20"', 'href="/answer-20"'),
          }
          for filename, (old, new) in transitions.items():
              path = Path(filename)
              if path.exists():
                  path.write_text(path.read_text().replace(old, new))
          PY

      - name: Commit navigation changes
        run: |
          if ! git diff --quiet -- index.html answer-10.html answer-14.html answer-19.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html answer-10.html answer-14.html answer-19.html
            git commit -m "Link expanded answers 04 through 24"
            git push
          else
            echo "Expanded answer links are already wired"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
