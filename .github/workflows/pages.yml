name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Keep all 24 expanded answers wired
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          index = Path('index.html')
          html = index.read_text()

          html = html.replace(
              'if(href&&!href.startsWith("#")){e.preventDefault();go(href)}',
              'if(href&&!href.startsWith("#")&&!href.startsWith("/answer-")){e.preventDefault();go(href)}',
              1,
          )

          if 'function answerHref(n)' not in html:
              html = html.replace(
                  'function go(url){',
                  'function answerHref(n){const s=String(n).padStart(2,"0");return n>=1&&n<=24?`/answer-${s}`:`?answer=${s}`}function go(url){',
                  1,
              )
          html = re.sub(
              r'return n>=\d+&&n<=\d+\?',
              'return n>=1&&n<=24?',
              html,
              count=1,
          )

          html = html.replace(
              'href="?answer=${String(a.n).padStart(2,"0")}"',
              'href="${answerHref(a.n)}"',
          )
          html = html.replace(
              'href="?answer=${String(next.n).padStart(2,"0")}"',
              'href="${answerHref(next.n)}"',
          )
          html = html.replace('href="?answer=04"', 'href="/answer-04"')
          index.write_text(html)
          PY

      - name: Generate SEO and discovery layer
        run: python scripts/seo.py

      - name: Synchronize crawlable What Hurts Today hub
        run: python scripts/hub.py

      - name: Apply launch, domain, portrait, and analytics release pass
        run: python scripts/release.py

      - name: Wire Contact Tate page
        run: python scripts/contact.py

      - name: Build and pin static author JPEG
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64
          import re

          # Decode the checked-in portrait source, extracting the real JPEG if
          # the legacy source is wrapped in SVG.
          parts = sorted(Path('portrait-hires').glob('part*.b64'))
          if not parts:
              raise SystemExit('No portrait source parts found')
          decoded = base64.b64decode(''.join(p.read_text().strip() for p in parts))
          jpeg = decoded
          if not jpeg.startswith(b'\xff\xd8'):
              wrapper = decoded.decode('utf-8')
              match = re.search(r'data:image/jpeg;base64,([^"\'\s<]+)', wrapper, re.I)
              if not match:
                  raise SystemExit('Embedded JPEG not found in portrait source')
              jpeg = base64.b64decode(match.group(1))
          if not jpeg.startswith(b'\xff\xd8'):
              raise SystemExit('Decoded author portrait is not a JPEG')
          Path('author-tate.jpg').write_bytes(jpeg)

          # Keep the site boring and reliable: point the img directly at the file.
          index = Path('index.html')
          html = index.read_text()
          html = re.sub(r'const AUTHOR="[^"]*";', 'const AUTHOR="/author-tate.jpg?v=3";', html, count=1)
          html = re.sub(
              r'/\* AUTHOR-PORTRAIT-LOADER-START \*/.*?/\* AUTHOR-PORTRAIT-LOADER-END \*/\s*',
              '',
              html,
              flags=re.S,
          )
          html = html.replace(' data-author-photo', '')
          index.write_text(html)
          PY

      - name: Commit generated site improvements
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html what-hurts-today.html contact.html answer-*.html sitemap.xml robots.txt author-tate.jpg
            git commit -m "Publish static author portrait and site updates"
            git push
          else
            echo "SEO, crawlable hub, contact, launch status, static portrait, analytics, and domain layer are already current"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
