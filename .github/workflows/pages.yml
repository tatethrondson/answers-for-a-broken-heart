name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Wire expanded answer pages into the site
        run: |
          python - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          html = index.read_text()

          # Do not let the SPA intercept clicks to the real standalone answer pages.
          html = html.replace(
              'if(href&&!href.startsWith("#")){e.preventDefault();go(href)}',
              'if(href&&!href.startsWith("#")&&!href.startsWith("/answer-")){e.preventDefault();go(href)}',
              1,
          )

          # Add one central URL helper for expanded answers 04-10.
          if 'function answerHref(n)' not in html:
              html = html.replace(
                  'function go(url){',
                  'function answerHref(n){const s=String(n).padStart(2,"0");return n>=4&&n<=10?`/answer-${s}`:`?answer=${s}`}function go(url){',
                  1,
              )

          # Point the What Hurts Today cards and dynamic next links at expanded pages when available.
          html = html.replace(
              'href="?answer=${String(a.n).padStart(2,"0")}"',
              'href="${answerHref(a.n)}"',
          )
          html = html.replace(
              'href="?answer=${String(next.n).padStart(2,"0")}"',
              'href="${answerHref(next.n)}"',
          )

          # The homepage sample should open the full Answer 04 page.
          html = html.replace('href="?answer=04"', 'href="/answer-04"')

          index.write_text(html)
          PY

      - name: Commit navigation changes
        run: |
          if ! git diff --quiet -- index.html; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add index.html
            git commit -m "Link expanded answers 04 through 10"
            git push
          else
            echo "Expanded answer links are already wired"
          fi

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
