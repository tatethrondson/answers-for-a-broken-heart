name: Deploy to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Inline Tate author portrait
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          index = Path('index.html')
          portrait = Path('author-tate.jpg')
          html = index.read_text()
          marker = 'const AUTHOR="author-tate.jpg";'
          if marker not in html:
              raise SystemExit('Author portrait marker not found in index.html')
          encoded = base64.b64encode(portrait.read_bytes()).decode('ascii')
          html = html.replace(marker, f'const AUTHOR="data:image/jpeg;base64,{encoded}";')
          index.write_text(html)
          PY

      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: '.'
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
