name: Body Visual Consistency Audit

on:
  push:
    branches: [main]
    paths:
      - 'scripts/body_style_audit.py'
      - 'site-homepage-lock.css'
      - '*.html'
      - '.github/workflows/body-style-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: body-visual-audit
  cancel-in-progress: true

jobs:
  audit:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Update body visual consistency audit'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Audit page-specific body styling
        run: python scripts/body_style_audit.py
      - name: Commit audit report
        run: |
          if [ -z "$(git status --porcelain -- BODY-STYLE-AUDIT.md)" ]; then
            echo "Body visual audit is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add BODY-STYLE-AUDIT.md
          git commit -m "Update body visual consistency audit"
          git pull --rebase origin main
          git push
