name: Tune Book Funnel

on:
  push:
    branches: [main]
    paths:
      - 'scripts/tune_book_funnel.py'
      - '.github/workflows/tune-book-funnel.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Tune book page
        run: python scripts/tune_book_funnel.py
      - name: Run site QA
        run: python scripts/site_qa.py
      - name: Commit book funnel changes
        run: |
          if [ -n "$(git status --porcelain -- book.html SITE-QA.md)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add book.html SITE-QA.md
            git commit -m "Make book funnel more help-first and precise"
            git pull --rebase origin main
            git push
          else
            echo "Book funnel is already current"
          fi
