name: Add contextual podcast resources

on:
  push:
    paths:
      - '.github/workflows/add-contextual-podcasts.yml'

permissions:
  contents: write

jobs:
  insert-podcasts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Insert podcast resources
        shell: python
        run: |
          from pathlib import Path

          restoration = '''<!-- PODCAST-RESOURCE-RESTORATION-START -->
          <section aria-label="Listen deeper: From Brokenness to Restoration" style="margin:40px 0;padding:28px 30px;background:#f6f1e8;border:1px solid #ddd6c9;border-top:4px solid #b69258;">
            <div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#88683b;margin-bottom:8px;">Listen deeper</div>
            <h2 style="font:400 2rem/1.1 Georgia,'Times New Roman',serif;color:#20372a;margin:0 0 10px;">From Brokenness to Restoration</h2>
            <p style="margin:0 0 18px;">When life feels shattered, it can help to hear a real conversation about how God meets people in broken places and begins the work of restoration.</p>
            <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background:#000;">
              <iframe src="https://www.youtube-nocookie.com/embed/opc26tntVRc" title="From Brokenness to Restoration podcast episode" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0;"></iframe>
            </div>
            <p style="margin:14px 0 0;font-size:.82rem;"><a href="https://youtu.be/opc26tntVRc" target="_blank" rel="noopener" style="font-weight:800;color:#294533;">Watch on YouTube →</a></p>
          </section>
          <!-- PODCAST-RESOURCE-RESTORATION-END -->'''

          bitterness = '''<!-- PODCAST-RESOURCE-BITTERNESS-START -->
          <section aria-label="Listen deeper: Building Bridges and Battling Bitterness" style="margin:40px 0;padding:28px 30px;background:#f6f1e8;border:1px solid #ddd6c9;border-top:4px solid #b69258;">
            <div style="font-size:.68rem;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:#88683b;margin-bottom:8px;">Listen deeper</div>
            <h2 style="font:400 2rem/1.1 Georgia,'Times New Roman',serif;color:#20372a;margin:0 0 10px;">Building Bridges and Battling Bitterness</h2>
            <p style="margin:0 0 18px;">If hurt has started hardening into resentment, this conversation goes deeper on forgiveness, relationships, and how to keep bitterness from owning your heart.</p>
            <div style="position:relative;padding-bottom:56.25%;height:0;overflow:hidden;background:#000;">
              <iframe src="https://www.youtube-nocookie.com/embed/2KjUVqldTNU" title="Building Bridges and Battling Bitterness podcast episode" loading="lazy" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen style="position:absolute;inset:0;width:100%;height:100%;border:0;"></iframe>
            </div>
            <p style="margin:14px 0 0;font-size:.82rem;"><a href="https://youtu.be/2KjUVqldTNU" target="_blank" rel="noopener" style="font-weight:800;color:#294533;">Watch on YouTube →</a></p>
          </section>
          <!-- PODCAST-RESOURCE-BITTERNESS-END -->'''

          placements = {
              'answer-07.html': ('PODCAST-RESOURCE-RESTORATION-START', restoration),
              'answer-17.html': ('PODCAST-RESOURCE-BITTERNESS-START', bitterness),
              'answer-21.html': ('PODCAST-RESOURCE-BITTERNESS-START', bitterness),
              'answer-22.html': ('PODCAST-RESOURCE-BITTERNESS-START', bitterness),
          }

          changed = []
          for filename, (marker, snippet) in placements.items():
              path = Path(filename)
              text = path.read_text()
              if marker in text:
                  continue
              anchor = '</article>' if '</article>' in text else '</main>'
              if anchor not in text:
                  raise SystemExit(f'No safe insertion point found in {filename}')
              text = text.replace(anchor, snippet + '\n' + anchor, 1)
              path.write_text(text)
              changed.append(filename)
          print('Updated:', ', '.join(changed) if changed else 'none')
      - name: Commit podcast placements
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add answer-07.html answer-17.html answer-21.html answer-22.html
          git commit -m "Add contextual podcast resources"
          git push origin main
