name: Publish Free Guides
# merge-trigger: publish the resource library through a normal main-branch merge
# production-refresh: 2026-08-09-2
# portrait-refresh: 2026-08-09-correct-proportions
# search-console-verification: 2026-08-10

on:
  push:
    branches:
      - main
    paths:
      - 'scripts/guides.py'
      - 'scripts/repair_author_source.py'
      - 'scripts/search_console.py'
      - 'free-guides.html'
      - 'can-christians-be-depressed.html'
      - '.github/workflows/guides.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: free-guides-publisher
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Restore proven author portrait source
        run: python scripts/repair_author_source.py

      - name: Integrate Free Guides
        run: python scripts/guides.py

      - name: Add Google Search Console verification
        run: python scripts/search_console.py

      - name: Commit generated site integration
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add scripts/guides.py index.html hope-thanks.html sitemap.xml
            git commit -m "Publish site integration"
            git push
          else
            echo "Site integration is already current"
          fi
