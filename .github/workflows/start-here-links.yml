name: Publish Start Here Links

on:
  push:
    branches: [main]
    paths:
      - 'scripts/start_here_links.py'
      - '.github/workflows/start-here-links.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Add Start Here links
        run: python scripts/start_here_links.py
      - name: Commit homepage
        run: |
          if git diff --quiet; then
            echo "No changes to publish"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Publish Start Here homepage links"
          git push