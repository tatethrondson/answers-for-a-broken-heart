name: Enforce Shared Site Design

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'site-interior-v3.css'
      - 'site-polish-v4.css'
      - 'site-homepage-lock.css'
      - 'scripts/design_normalize.py'
      - 'scripts/shell_finalize.py'
      - 'scripts/style_audit.py'
      - 'scripts/nav_audit.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: shared-site-design
  cancel-in-progress: true

jobs:
  normalize:
    if: github.event_name == 'workflow_dispatch' || (github.event.head_commit.message != 'Publish final site audit cleanup' && github.event.head_commit.message != 'Publish shared site design')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Normalize interior design system
        run: python scripts/design_normalize.py

      - name: Finalize one shared header and footer
        run: python scripts/shell_finalize.py

      - name: Audit homepage design consistency
        run: python scripts/style_audit.py

      - name: Audit navigation consistency
        run: python scripts/nav_audit.py

      - name: QA generated pages
        run: python scripts/site_qa.py

      - name: Commit normalized site
        run: |
          if [ -z "$(git status --porcelain -- '*.html' 'SITE-QA.md' 'STYLE-AUDIT.md' 'NAV-AUDIT.md')" ]; then
            echo "Shared design is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html' SITE-QA.md STYLE-AUDIT.md NAV-AUDIT.md
          git commit -m "Publish shared site design"
          git pull --rebase origin main
          git push
