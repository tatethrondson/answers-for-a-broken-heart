name: Publish Premium Site Polish

on:
  push:
    branches: [main]
    paths:
      - '*.html'
      - 'scripts/premium_polish.py'
      - 'scripts/premium_polish_refine.py'
      - 'scripts/premium_polish_repair.py'
      - 'scripts/unify_design.py'
      - '.github/workflows/premium-polish.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: premium-site-polish
  cancel-in-progress: true

jobs:
  polish:
    if: github.event_name == 'workflow_dispatch' || github.event.head_commit.message != 'Publish premium site polish'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Apply premium polish layer
        run: python scripts/premium_polish.py
      - name: Apply final polish refinements
        run: python scripts/premium_polish_refine.py
      - name: Guarantee repeatable premium shell
        run: python scripts/premium_polish_repair.py
      - name: Enforce homepage design across every page
        run: python scripts/unify_design.py
      - name: Commit polished site
        run: |
          if [ -z "$(git status --porcelain -- '*.html')" ]; then
            echo "Premium polish is already current"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add '*.html'
          git commit -m "Publish premium site polish"
          git pull --rebase origin main
          git push
