name: Site QA

# The Publish Site Audit Cleanup workflow is the authoritative automated QA path.
# Keep this workflow available for an explicit manual audit without racing the
# normalization/polish workflow and writing a stale report to main.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Run site QA
        run: python scripts/site_qa.py
