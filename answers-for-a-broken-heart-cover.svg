<text x="370" y="300" font-size="34" letter-spacing="14">ANSWERS</text>
<text x="365" y="361" font-size="27" letter-spacing="11">FOR A</text>
<text x="360" y="510" font-size="90" letter-spacing="1">BROKEN</text>
<text x="365" y="622" font-size="107" letter-spacing="4">HEART</text>
<text x="367" y="924" font-size="29" letter-spacing="9">TATE THRONDSON</text>
</g>
