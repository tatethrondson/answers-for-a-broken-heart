<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 1080" role="img" aria-labelledby="title desc">
<title id="title">Answers for a Broken Heart — Tate Throndson</title>
<desc id="desc">Black linen cover with elegant gold lettering and a small ornamental sprig.</desc>
<defs>
<linearGradient id="cloth" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#242422"/><stop offset=".52" stop-color="#121212"/><stop offset="1" stop-color="#080909"/></linearGradient>
<linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop stop-color="#f8db95"/><stop offset=".32" stop-color="#a76c25"/><stop offset=".55" stop-color="#f2c775"/><stop offset=".8" stop-color="#c38b3d"/><stop offset="1" stop-color="#f6df9b"/></linearGradient>
<filter id="linen"><feTurbulence type="fractalNoise" baseFrequency=".75 .035" numOctaves="3" seed="4" stitchTiles="stitch"/><feColorMatrix type="saturate" values="0"/><feComponentTransfer><feFuncA type="linear" slope=".18"/></feComponentTransfer><feBlend in="SourceGraphic" mode="multiply"/></filter>
<pattern id="weave" width="4" height="4" patternUnits="userSpaceOnUse"><path d="M0 0H4M0 0V4" stroke="#888" stroke-opacity=".065" stroke-width=".36"/></pattern>
</defs>
<rect width="720" height="1080" rx="7" fill="url(#cloth)"/>
<rect width="720" height="1080" fill="url(#weave)"/>
<rect x="23" y="0" width="26" height="1080" fill="#080808" opacity=".48"/><path d="M47 0V1080" stroke="#5b5650" stroke-width="2" opacity=".28"/>
